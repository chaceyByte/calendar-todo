<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple-style rounded square background -->
  <rect width="1024" height="1024" rx="226" fill="url(#backgroundGradient)"/>
  
  <!-- Blue hexagon with Apple-style gradient -->
  <path d="M512 180L758 322V608L512 750L266 608V322L512 180Z" fill="url(#hexagonGradient)"/>
  
  <!-- Inner hexagon outline -->
  <path d="M512 245L693 350V562L512 667L331 562V350L512 245Z" stroke="white" stroke-width="24" stroke-linejoin="round"/>
  
  <!-- Apple-style pencil -->
  <g transform="translate(180, 180) rotate(45)">
    <!-- Pencil body -->
    <rect x="150" y="280" width="140" height="420" rx="12" fill="url(#pencilGradient)"/>
    
    <!-- Pencil tip -->
    <path d="M150 700L220 700L260 780L110 780L150 700Z" fill="#F5C69B"/>
    <path d="M150 700L220 700L185 770L150 700Z" fill="#E8B685"/>
    
    <!-- Pencil lead -->
    <path d="M175 770L195 770L185 790L175 770Z" fill="#2C2C2C"/>
    
    <!-- Metal band -->
    <rect x="150" y="260" width="140" height="30" rx="6" fill="url(#metalGradient)"/>
    
    <!-- Eraser -->
    <rect x="165" y="220" width="110" height="50" rx="8" fill="url(#eraserGradient)"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <!-- Background gradient - Apple-style subtle light -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F7FA"/>
      <stop offset="100%" style="stop-color:#E8ECF1"/>
    </linearGradient>
    
    <!-- Hexagon gradient - Apple blue -->
    <linearGradient id="hexagonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5AC8FA"/>
      <stop offset="100%" style="stop-color:#007AFF"/>
    </linearGradient>
    
    <!-- Pencil gradient - Apple orange -->
    <linearGradient id="pencilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    
    <!-- Metal band gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D1D5DA"/>
      <stop offset="50%" style="stop-color:#F0F2F5"/>
      <stop offset="100%" style="stop-color:#B9BDC4"/>
    </linearGradient>
    
    <!-- Eraser gradient -->
    <linearGradient id="eraserGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043"/>
      <stop offset="100%" style="stop-color:#F4511E"/>
    </linearGradient>
  </defs>
</svg>
